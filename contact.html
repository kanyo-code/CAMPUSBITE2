<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact CampusBites | Student Support & General Enquiries</title>
    <meta name="description" content="Get in touch with CampusBites. Send us a message regarding your food delivery, document printing, or general enquiries." />
    <meta name="keywords" content="contact campusbites, student support, food delivery help, campus printing contact" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <img src="campusbitelogo.png" alt="CampusBites student food delivery logo" class="logo-image" />
                <div class="logo-text-wrapper">
                    <span class="logo-brand"><span class="orange">CAMPUS</span><span class="yellow">BITES</span></span>
                    <span class="logo-slogan">Bite Into <span class="highlight">Happiness</span></span>
                </div>
            </a>
            <nav class="nav">
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="printing.html">Printing</a></li>
                    <li><a href="order.html">Order</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <section class="form-section">
        <div class="container form-container">
            <h2>Contact Us</h2>
            <p>Have a question or need help with an order? Send us a message.</p>

            <form id="contactForm" action="https://formsubmit.co/st10491900@rcconnect.edu.za" method="POST" novalidate>
                <input type="hidden" name="_captcha" value="false" />
                <input type="hidden" name="_subject" value="New Message from CampusBites Website!" />

                <div class="form-group">
                    <label for="contactName">Full Name *</label>
                    <input type="text" id="contactName" name="name" placeholder="e.g. Jane Smith" />
                    <span class="error-msg" id="cNameError"></span>
                </div>

                <div class="form-group">
                    <label for="contactEmail">Email Address *</label>
                    <input type="email" id="contactEmail" name="email" placeholder="e.g. jane@student.edu" />
                    <span class="error-msg" id="cEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="messageType">Type of Message *</label>
                    <select id="messageType" name="messageType">
                        <option value="">-- Select a topic --</option>
                        <option value="Order Issue">Order Issue / Missing Item</option>
                        <option value="Printing Help">Printing Help</option>
                        <option value="Sponsorship">Sponsorship / Partnership</option>
                        <option value="General">General Enquiry</option>
                    </select>
                    <span class="error-msg" id="cTypeError"></span>
                </div>

                <div class="form-group">
                    <label for="contactMessage">Your Message *</label>
                    <textarea id="contactMessage" name="message" rows="5" placeholder="Type your message here..."></textarea>
                    <span class="error-msg" id="cMsgError"></span>
                </div>

                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 CampusBites. All rights reserved. | Bite Into Happiness</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            if (navLinks) {
                navLinks.classList.toggle('active');
            }
        }

        const contactForm = document.getElementById('contactForm');

        if (contactForm) {
            contactForm.addEventListener('submit', function(event) {
                document.getElementById('cNameError').innerText = '';
                document.getElementById('cEmailError').innerText = '';
                document.getElementById('cTypeError').innerText = '';
                document.getElementById('cMsgError').innerText = '';

                const name = document.getElementById('contactName').value.trim();
                const email = document.getElementById('contactEmail').value.trim();
                const type = document.getElementById('messageType').value;
                const message = document.getElementById('contactMessage').value.trim();

                let isValid = true;

                if (name === '') {
                    document.getElementById('cNameError').innerText = 'Please enter your name.';
                    isValid = false;
                }

                const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
                if (!email.match(emailPattern)) {
                    document.getElementById('cEmailError').innerText = 'Please enter a valid email address.';
                    isValid = false;
                }

                if (type === '') {
                    document.getElementById('cTypeError').innerText = 'Please select a message type.';
                    isValid = false;
                }

                if (message.length < 10) {
                    document.getElementById('cMsgError').innerText = 'Message must be at least 10 characters long.';
                    isValid = false;
                }

                if (!isValid) {
                    event.preventDefault();
                }
            });
        }
    </script>
</body>
</html>
